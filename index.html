<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Plants</title>
  <link rel="stylesheet" href="style.css">
</head>

<body>
  <header class="app-header">
    <div>
      <p class="eyebrow">MY COLLECTION</p>
      <h1>My Plants</h1>
      <p class="subtitle">Care notes for the plants I grow.</p>
    </div>
  </header>

  <main>
    <section class="collection">
      <div class="section-heading">
        <h2>Plants</h2>
        <span class="plant-count">3 plants</span>
      </div>

      <div class="plant-grid">
        <article class="plant-card">
          <div class="plant-icon">🌿</div>
          <div class="plant-info">
            <h3>Pandan</h3>
            <p class="scientific-name">Pandanus amaryllifolius</p>
            <span class="location">Indoors</span>
          </div>
        </article>

        <article class="plant-card">
          <div class="plant-icon">🌱</div>
          <div class="plant-info">
            <h3>Rau răm</h3>
            <p class="scientific-name">Persicaria odorata</p>
            <span class="location">Outdoors</span>
          </div>
        </article>

        <article class="plant-card">
          <div class="plant-icon">🍃</div>
          <div class="plant-info">
            <h3>Spearmint</h3>
            <p class="scientific-name">Mentha spicata</p>
            <span class="location">Outdoors</span>
          </div>
        </article>
      </div>

      <button class="add-button" type="button">+ Add Plant</button>
    </section>
  </main>
  <script src="app.js"></script>
</body>
</html>
